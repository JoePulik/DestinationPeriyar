<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysian Heights - Homestay Offer &amp; Secure Payment</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- QR Code Generator Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <style>
        :root {
            --bg-dark: #0c0b09;
            --bg-card: #151411;
            --primary: #cda45e;
            --primary-hover: #d8b26e;
            --text-light: #f4f4f0;
            --text-muted: #a4a4a0;
            --border: rgba(205, 164, 94, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* Top Header */
        .pay-header {
            background: #151411;
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            text-align: center;
        }

        .pay-header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pay-brand {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-decoration: none;
            font-weight: 700;
        }

        .pay-badge {
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 600;
            border: 1px solid var(--border);
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
        }

        /* Main Container */
        .pay-container {
            max-width: 820px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .pay-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        @media (max-width: 600px) {
            .pay-card {
                padding: 1.5rem;
            }
        }

        .status-pill {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        .status-pill.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .status-pill.offer {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
            border: 1px solid rgba(6, 182, 212, 0.35);
        }

        .status-pill.confirmed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .pay-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 0.4rem;
        }

        .pay-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Host Message Box */
        .host-message-card {
            background: rgba(205, 164, 94, 0.06);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
        }

        .host-message-card h4 {
            font-size: 0.82rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .host-message-card p {
            font-size: 0.92rem;
            color: #dedcd8;
            font-style: italic;
            line-height: 1.5;
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 2rem;
            background: #0c0b09;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-item-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .detail-item-value {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        /* Financial Breakdown */
        .breakdown-card {
            background: #0c0b09;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .breakdown-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.92rem;
            padding: 0.45rem 0;
            color: var(--text-light);
        }

        .breakdown-line strong {
            color: #fff;
        }

        .breakdown-total {
            border-top: 1px solid var(--border);
            margin-top: 0.75rem;
            padding-top: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .total-amount {
            font-family: var(--font-serif);
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .advance-highlight-row {
            background: rgba(205, 164, 94, 0.12);
            border: 1px dashed var(--primary);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .advance-label {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 600;
        }

        .advance-price {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Payment Tabs & Gateways */
        .payment-methods-box {
            margin-top: 2rem;
        }

        .payment-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .pay-tab-btn {
            padding: 0.75rem 1.25rem;
            background: #0c0b09;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pay-tab-btn:hover {
            border-color: var(--border);
            color: #fff;
        }

        .pay-tab-btn.active {
            background: rgba(205, 164, 94, 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .pay-tab-pane {
            display: none;
            background: #0c0b09;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
        }

        .pay-tab-pane.active {
            display: block;
        }

        .upi-qr-wrapper {
            background: #fff;
            padding: 1rem;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .upi-apps-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-pay {
            display: inline-block;
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-pay:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(205, 164, 94, 0.4);
        }

        /* Confirmed Voucher Layout */
        .voucher-container {
            text-align: center;
            padding: 2rem 0;
        }

        .voucher-seal {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            color: #10b981;
        }

        .voucher-id-pill {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            background: rgba(205, 164, 94, 0.15);
            border: 1px dashed var(--primary);
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .pay-header, .btn-pay, .no-print {
                display: none !important;
            }
            .pay-card {
                border: 2px solid #333 !important;
                box-shadow: none !important;
                color: #000 !important;
                background: #fff !important;
            }
            .pay-title, .detail-item-value, .total-amount, strong {
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="pay-header">
        <div class="pay-header-content">
            <a href="index.html" class="pay-brand">ELYSIAN HEIGHTS</a>
            <span class="pay-badge">Boutique Homestay</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="pay-container" id="payMainContainer">
        <!-- Rendered dynamically by script -->
        <div style="text-align:center;padding:4rem 0;">
            <p style="color:var(--text-muted);">Loading reservation details...</p>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'elysian_homestay_bookings';

        function getStoredBookings() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveStoredBookings(list) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const bookingId = params.get('id');

            const allBookings = getStoredBookings();
            const booking = allBookings.find(b => b.id === bookingId);

            const container = document.getElementById('payMainContainer');

            if (!booking) {
                renderLookupForm(container, bookingId);
                return;
            }

            if (booking.status === 'CONFIRMED') {
                renderConfirmedVoucher(container, booking);
            } else if (booking.status === 'OFFER_SENT') {
                renderApprovedOffer(container, booking);
            } else if (booking.status === 'PENDING_APPROVAL') {
                renderPendingApproval(container, booking);
            } else {
                renderDeclined(container, booking);
            }
        });

        // 1. Pending Approval State
        function renderPendingApproval(container, b) {
            container.innerHTML = `
                <div class="pay-card" style="text-align:center;padding:3.5rem 2rem;">
                    <span class="status-pill pending">⏳ Awaiting Host Approval</span>
                    <h2 class="pay-title">Request Under Host Review</h2>
                    <p class="pay-subtitle">Reservation Reference: <strong style="color:var(--primary);">${b.id}</strong></p>

                    <p style="max-width:560px;margin:0 auto 2rem auto;color:#b4b4b0;font-size:0.95rem;line-height:1.6;">
                        Thank you, <strong>${b.guestName}</strong>! Because Elysian Heights is an exclusive private homestay, all requests are personally reviewed by the host. 
                        <strong>No payment is charged upfront.</strong> You will receive a personalized offer with instant payment link once approved.
                    </p>

                    <div class="details-grid" style="text-align:left;max-width:540px;margin:0 auto 2rem auto;">
                        <div>
                            <div class="detail-item-label">Stay Itinerary</div>
                            <div class="detail-item-value">${b.checkIn} to ${b.checkOut}</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Duration &amp; Party</div>
                            <div class="detail-item-value">${b.nights} Nights &bull; ${b.adults} Adults${b.children > 0 ? ', ' + b.children + ' Kids' : ''}</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Estimated Fare</div>
                            <div class="detail-item-value" style="color:var(--primary);">₹${b.estimatedTotal.toLocaleString('en-IN')}</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Accommodation</div>
                            <div class="detail-item-value">Exclusive 4 BHK Estate</div>
                        </div>
                    </div>

                    <a href="https://wa.me/919876543210?text=${encodeURIComponent('Hello Host! I am checking on my booking request: ' + b.id + ' for ' + b.checkIn)}" target="_blank" class="btn-pay" style="max-width:380px;background:#25d366;color:#fff;margin:0 auto;display:inline-block;">
                        💬 Chat with Host on WhatsApp &rarr;
                    </a>
                </div>
            `;
        }

        // 2. Approved Offer & Payment State
        function renderApprovedOffer(container, b) {
            const offer = b.offer || {
                finalOfferTotal: b.estimatedTotal,
                advancePayable: Math.round(b.estimatedTotal * 0.5),
                balanceOnArrival: Math.round(b.estimatedTotal * 0.5),
                hostNotes: 'Delighted to host your stay at Elysian Heights.'
            };

            const upiId = 'elysianheights@okhdfcbank';
            const upiUrl = `upi://pay?pa=${upiId}&pn=ElysianHeightsHomestay&am=${offer.advancePayable}&tn=Booking-${b.id}`;

            container.innerHTML = `
                <div class="pay-card">
                    <span class="status-pill offer">✨ Host Approved &bull; Special Offer Ready</span>
                    <h2 class="pay-title">Your Homestay Offer</h2>
                    <p class="pay-subtitle">Personalized Proposal for <strong>${b.guestName}</strong> &bull; Ref: <span style="color:var(--primary);">${b.id}</span></p>

                    <!-- Host Personal Welcome Note -->
                    <div class="host-message-card">
                        <h4>🌟 Note from Your Host</h4>
                        <p>"${offer.hostNotes || 'We are delighted to welcome you to our private river-view retreat. We have prepared this special offer for your upcoming stay.'}"</p>
                    </div>

                    <!-- Stay Details Grid -->
                    <div class="details-grid">
                        <div>
                            <div class="detail-item-label">Check-In Date</div>
                            <div class="detail-item-value">📅 ${b.checkIn} (from 2:00 PM)</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Check-Out Date</div>
                            <div class="detail-item-value">📅 ${b.checkOut} (until 11:00 AM)</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Duration</div>
                            <div class="detail-item-value">${b.nights} Nights Stay</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Party Size</div>
                            <div class="detail-item-value">👥 ${b.adults} Adults${b.children > 0 ? ', ' + b.children + ' Kids' : ''}</div>
                        </div>
                    </div>

                    <!-- Financial Breakdown -->
                    <div class="breakdown-card">
                        <div class="breakdown-line">
                            <span>Exclusive 4 BHK Villa (${b.nights} Nights)</span>
                            <strong>₹${(offer.finalOfferTotal * 0.85).toLocaleString('en-IN', {maximumFractionDigits:0})}</strong>
                        </div>
                        ${offer.discountPercent ? `
                        <div class="breakdown-line" style="color:#10b981;">
                            <span>Special Host Welcome Privilege</span>
                            <strong>-${offer.discountPercent}% Applied</strong>
                        </div>` : ''}
                        <div class="breakdown-line">
                            <span>Requested Homestay Inclusions</span>
                            <strong>${b.addons?.join(', ') || 'Included'}</strong>
                        </div>
                        <div class="breakdown-total">
                            <span style="font-size:1.05rem;font-weight:600;">Total Stay Investment:</span>
                            <span class="total-amount">₹${offer.finalOfferTotal.toLocaleString('en-IN')}</span>
                        </div>

                        <div class="advance-highlight-row">
                            <div>
                                <span class="advance-label">Payable Now to Confirm (50% Advance)</span>
                                <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.15rem;">Balance of ₹${offer.balanceOnArrival.toLocaleString('en-IN')} payable on arrival</div>
                            </div>
                            <div class="advance-price">₹${offer.advancePayable.toLocaleString('en-IN')}</div>
                        </div>
                    </div>

                    <!-- Payment Gateways Section -->
                    <div class="payment-methods-box">
                        <h3 style="font-family:var(--font-serif);font-size:1.6rem;color:#fff;margin-bottom:0.4rem;">Select Payment Method</h3>
                        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1.25rem;">Complete your 50% advance payment to officially secure your dates.</p>

                        <div class="payment-tabs">
                            <button class="pay-tab-btn active" onclick="switchPayTab('upi')">⚡ Instant UPI / QR Code</button>
                            <button class="pay-tab-btn" onclick="switchPayTab('bank')">🏛️ Direct Bank Wire (NEFT)</button>
                            <button class="pay-tab-btn" onclick="switchPayTab('card')">💳 Credit / Debit Card</button>
                        </div>

                        <!-- UPI Tab -->
                        <div id="tab-upi" class="pay-tab-pane active">
                            <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:1rem;">Scan with any UPI App (Google Pay, PhonePe, Paytm, BHIM):</p>
                            
                            <div class="upi-qr-wrapper">
                                <canvas id="upiQrCanvas"></canvas>
                            </div>

                            <div style="font-size:0.92rem;color:var(--primary);font-weight:700;margin-bottom:0.5rem;letter-spacing:0.05em;">
                                UPI ID: ${upiId}
                            </div>

                            <div style="margin-bottom:1.5rem;">
                                <a href="${upiUrl}" class="btn-pay" style="max-width:300px;margin:0 auto;display:inline-block;padding:0.75rem 1.25rem;font-size:0.88rem;">
                                    Pay via UPI App &nearr;
                                </a>
                            </div>

                            <form onsubmit="handleGuestPayment(event, '${b.id}', 'UPI', ${offer.advancePayable})" style="max-width:400px;margin:1.5rem auto 0 auto;text-align:left;border-top:1px solid var(--border-subtle);padding-top:1.5rem;">
                                <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.4rem;">Enter UPI Transaction Ref / UTR:</label>
                                <input type="text" id="upiUtrInput" required placeholder="E.g. 428190382910" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border);border-radius:4px;color:#fff;margin-bottom:1rem;font-family:inherit;">
                                <button type="submit" class="btn-pay" style="background:#10b981;color:#fff;">✓ I Have Completed Payment</button>
                            </form>
                        </div>

                        <!-- Bank Wire Tab -->
                        <div id="tab-bank" class="pay-tab-pane">
                            <div style="text-align:left;max-width:480px;margin:0 auto 1.5rem auto;background:#151411;border:1px solid var(--border);border-radius:8px;padding:1.5rem;">
                                <div style="font-size:0.78rem;color:var(--primary);text-transform:uppercase;margin-bottom:0.25rem;font-weight:600;">Beneficiary Name</div>
                                <div style="font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:1rem;">Elysian Heights Homestay</div>

                                <div style="font-size:0.78rem;color:var(--primary);text-transform:uppercase;margin-bottom:0.25rem;font-weight:600;">Bank &amp; Branch</div>
                                <div style="font-size:0.95rem;color:#fff;margin-bottom:1rem;">HDFC Bank, Idukki / Thodupuzha Branch</div>

                                <div style="font-size:0.78rem;color:var(--primary);text-transform:uppercase;margin-bottom:0.25rem;font-weight:600;">Account Number</div>
                                <div style="font-size:1.15rem;font-family:monospace;color:var(--primary);letter-spacing:0.1em;margin-bottom:1rem;">50200084920192</div>

                                <div style="font-size:0.78rem;color:var(--primary);text-transform:uppercase;margin-bottom:0.25rem;font-weight:600;">IFSC Code</div>
                                <div style="font-size:1.1rem;font-family:monospace;color:#fff;">HDFC0001824</div>
                            </div>

                            <form onsubmit="handleGuestPayment(event, '${b.id}', 'Bank Wire', ${offer.advancePayable})" style="max-width:400px;margin:0 auto;text-align:left;">
                                <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.4rem;">Enter Bank Transfer Reference (UTR):</label>
                                <input type="text" id="bankUtrInput" required placeholder="E.g. N1840291038" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border);border-radius:4px;color:#fff;margin-bottom:1rem;font-family:inherit;">
                                <button type="submit" class="btn-pay" style="background:#10b981;color:#fff;">✓ Confirm Bank Transfer</button>
                            </form>
                        </div>

                        <!-- Card Tab -->
                        <div id="tab-card" class="pay-tab-pane">
                            <form onsubmit="handleGuestPayment(event, '${b.id}', 'Credit/Debit Card', ${offer.advancePayable})" style="max-width:440px;margin:0 auto;text-align:left;">
                                <div style="margin-bottom:1rem;">
                                    <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.35rem;">Cardholder Name</label>
                                    <input type="text" required placeholder="${b.guestName}" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border-subtle);border-radius:4px;color:#fff;">
                                </div>
                                <div style="margin-bottom:1rem;">
                                    <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.35rem;">Card Number</label>
                                    <input type="text" required placeholder="•••• •••• •••• 4242" maxlength="19" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border-subtle);border-radius:4px;color:#fff;letter-spacing:0.1em;">
                                </div>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;">
                                    <div>
                                        <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.35rem;">Valid Thru</label>
                                        <input type="text" required placeholder="MM/YY" maxlength="5" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border-subtle);border-radius:4px;color:#fff;text-align:center;">
                                    </div>
                                    <div>
                                        <label style="font-size:0.78rem;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:0.35rem;">CVV</label>
                                        <input type="password" required placeholder="•••" maxlength="4" style="width:100%;padding:0.75rem;background:#151411;border:1px solid var(--border-subtle);border-radius:4px;color:#fff;text-align:center;">
                                    </div>
                                </div>
                                <button type="submit" class="btn-pay">Pay ₹${offer.advancePayable.toLocaleString('en-IN')} &rarr;</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;

            // Render QR Code
            setTimeout(() => {
                const canvas = document.getElementById('upiQrCanvas');
                if (canvas && typeof QRCode !== 'undefined') {
                    QRCode.toCanvas(canvas, upiUrl, { width: 190, margin: 1, color: { dark: '#0c0b09', light: '#ffffff' } });
                }
            }, 50);
        }

        function switchPayTab(tab) {
            document.querySelectorAll('.pay-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.pay-tab-pane').forEach(pane => pane.classList.remove('active'));

            const targetBtn = event.currentTarget;
            if (targetBtn) targetBtn.classList.add('active');

            const targetPane = document.getElementById(`tab-${tab}`);
            if (targetPane) targetPane.classList.add('active');
        }

        function handleGuestPayment(event, bookingId, method, amount) {
            event.preventDefault();
            const bookings = getStoredBookings();
            const b = bookings.find(x => x.id === bookingId);
            if (!b) return;

            let refNum = 'PAY-' + Math.floor(100000 + Math.random() * 900000);
            if (method === 'UPI') refNum = document.getElementById('upiUtrInput')?.value || refNum;
            if (method === 'Bank Wire') refNum = document.getElementById('bankUtrInput')?.value || refNum;

            b.status = 'CONFIRMED';
            b.payment = {
                method: method,
                reference: refNum,
                amountPaid: amount,
                paidAt: new Date().toISOString()
            };

            saveStoredBookings(bookings);
            alert('Payment successfully submitted! Your booking is officially secured.');
            renderConfirmedVoucher(document.getElementById('payMainContainer'), b);
        }

        // 3. Confirmed Voucher State
        function renderConfirmedVoucher(container, b) {
            const offer = b.offer || { finalOfferTotal: b.estimatedTotal, advancePayable: b.payment?.amountPaid || 0, balanceOnArrival: 0 };
            const payment = b.payment || { method: 'UPI Approval', reference: 'OFFLINE_CONFIRMATION', amountPaid: offer.advancePayable };

            container.innerHTML = `
                <div class="pay-card voucher-container">
                    <div class="voucher-seal">
                        <svg viewBox="0 0 24 24" width="42" height="42" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>

                    <span class="status-pill confirmed">✓ Official Reservation Confirmed</span>
                    <h2 class="pay-title" style="margin-bottom:0.25rem;">Elysian Heights Homestay</h2>
                    <span class="voucher-id-pill">BOOKING PASS: ${b.id}</span>

                    <p style="font-size:0.95rem;color:#dedcd8;max-width:540px;margin:0 auto 2rem auto;">
                        Congratulations, <strong>${b.guestName}</strong>! Your stay at Elysian Heights has been officially secured. 
                        We look forward to hosting your private retreat above the Periyar River.
                    </p>

                    <div class="details-grid" style="text-align:left;margin-bottom:2rem;">
                        <div>
                            <div class="detail-item-label">Guest of Record</div>
                            <div class="detail-item-value">${b.guestName}</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Party Size</div>
                            <div class="detail-item-value">${b.adults} Adults${b.children > 0 ? ', ' + b.children + ' Kids' : ''}</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Check-In</div>
                            <div class="detail-item-value">📅 ${b.checkIn} (from 2:00 PM)</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Check-Out</div>
                            <div class="detail-item-value">📅 ${b.checkOut} (until 11:00 AM)</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Accommodation</div>
                            <div class="detail-item-value">Exclusive 4 BHK Estate</div>
                        </div>
                        <div>
                            <div class="detail-item-label">Selected Inclusions</div>
                            <div class="detail-item-value" style="color:var(--primary);">${b.addons?.join(', ') || 'Standard Homestay Inclusions'}</div>
                        </div>
                    </div>

                    <!-- Payment Record -->
                    <div class="breakdown-card" style="text-align:left;">
                        <h4 style="font-size:0.85rem;color:var(--primary);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.75rem;">Payment Receipt</h4>
                        <div class="breakdown-line">
                            <span>Total Stay Tariff:</span>
                            <strong>₹${offer.finalOfferTotal.toLocaleString('en-IN')}</strong>
                        </div>
                        <div class="breakdown-line" style="color:#10b981;">
                            <span>Advance Paid (${payment.method}):</span>
                            <strong>✓ ₹${payment.amountPaid.toLocaleString('en-IN')} (Ref: ${payment.reference})</strong>
                        </div>
                        <div class="breakdown-line">
                            <span>Balance Due at Check-In:</span>
                            <strong style="color:var(--primary);">₹${(offer.balanceOnArrival || (offer.finalOfferTotal - payment.amountPaid)).toLocaleString('en-IN')}</strong>
                        </div>
                    </div>

                    <!-- Property Location & Contact -->
                    <div style="background:#0c0b09;border:1px solid var(--border-subtle);border-radius:8px;padding:1.5rem;text-align:left;margin-bottom:2rem;">
                        <h4 style="font-size:0.85rem;color:var(--primary);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.5rem;">Estate Arrival &amp; Concierge</h4>
                        <p style="font-size:0.9rem;color:#fff;margin-bottom:0.25rem;">📍 <strong>Elysian Heights</strong>, Periyar River Bluff, Idukki Highlands, Kerala</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.25rem;">📞 Caretaker / Host On-Site: +91 98765 43210 (Mr. Thomas)</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">✉️ Support: stay@elysianheights.com</p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="no-print" style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
                        <button onclick="window.print()" class="btn-pay" style="max-width:240px;background:#151411;color:#fff;border:1px solid var(--border);">
                            🖨️ Print / Save PDF
                        </button>
                        <a href="https://wa.me/919876543210?text=${encodeURIComponent('Hello Host! I am confirming our arrival at Elysian Heights for booking ' + b.id + ' on ' + b.checkIn)}" target="_blank" class="btn-pay" style="max-width:280px;background:#25d366;color:#fff;">
                            💬 Open Host on WhatsApp
                        </a>
                        <a href="index.html" class="btn-pay" style="max-width:200px;background:transparent;color:var(--text-muted);border:1px solid var(--border-subtle);">
                            &larr; Back to Site
                        </a>
                    </div>
                </div>
            `;
        }

        // 4. Declined State
        function renderDeclined(container, b) {
            container.innerHTML = `
                <div class="pay-card" style="text-align:center;padding:3.5rem 2rem;">
                    <span class="status-pill" style="background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.35);">Request Unavailable</span>
                    <h2 class="pay-title">Dates Unavailable</h2>
                    <p class="pay-subtitle">Ref: <span style="color:var(--primary);">${b.id}</span></p>

                    <p style="max-width:540px;margin:0 auto 2rem auto;color:var(--text-muted);font-size:0.95rem;">
                        We apologize, but the estate is fully reserved on the dates you requested (${b.checkIn} to ${b.checkOut}). 
                        Please contact the host directly to discuss alternative dates.
                    </p>

                    <a href="https://wa.me/919876543210?text=${encodeURIComponent('Hello Host, I was inquiring about alternative dates for ' + b.id)}" target="_blank" class="btn-pay" style="max-width:320px;background:#25d366;color:#fff;margin:0 auto;display:inline-block;">
                        Chat on WhatsApp for Dates &rarr;
                    </a>
                </div>
            `;
        }

        // 5. Lookup Form (when no ID is in URL)
        function renderLookupForm(container, searchedId) {
            container.innerHTML = `
                <div class="pay-card" style="text-align:center;max-width:520px;margin:3rem auto;">
                    <span class="status-pill offer">Homestay Portal</span>
                    <h2 class="pay-title" style="font-size:1.85rem;">Find Your Booking</h2>
                    <p class="pay-subtitle">Enter your Booking Reference ID (e.g., EH-2026-7241) to view your approved offer or stay voucher.</p>

                    <form onsubmit="handleLookup(event)">
                        <input type="text" id="lookupIdInput" required placeholder="EH-2026-XXXX" value="${searchedId || ''}" style="width:100%;padding:0.85rem;background:#0c0b09;border:1px solid var(--border);border-radius:6px;color:var(--primary);text-align:center;font-size:1.2rem;letter-spacing:0.15em;font-weight:700;margin-bottom:1.25rem;">
                        <button type="submit" class="btn-pay">Search Reservation &rarr;</button>
                    </form>
                    <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);display:inline-block;margin-top:1.5rem;text-decoration:none;">&larr; Return to main site</a>
                </div>
            `;
        }

        function handleLookup(event) {
            event.preventDefault();
            const val = document.getElementById('lookupIdInput').value.trim().toUpperCase();
            if (val) {
                window.location.href = `payment.html?id=${encodeURIComponent(val)}`;
            }
        }
    </script>
</body>
</html>
